name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            args: --target aarch64-apple-darwin --bundles app
          - name: macOS x64
            os: macos-latest
            args: --target x86_64-apple-darwin --bundles app
          - name: Windows x64
            os: windows-latest
            args: ""

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Verify release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const packageVersion = require("./package.json").version;
          const tauriVersion = require("./src-tauri/tauri.conf.json").version;
          const cargoVersion = fs.readFileSync("./src-tauri/Cargo.toml", "utf8")
            .match(/^\[package\]\s*[\s\S]*?^version = "([^"]+)"/m)?.[1];
          const versions = [packageVersion, tauriVersion, cargoVersion];
          if (versions.some((version) => !version || version !== packageVersion) || process.env.RELEASE_TAG !== `v${packageVersion}`) {
            console.error(`Release version mismatch: tag=${process.env.RELEASE_TAG}, package=${packageVersion}, tauri=${tauriVersion}, cargo=${cargoVersion}`);
            process.exit(1);
          }
          NODE

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Publish Tauri release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Picture Cleaner ${{ github.ref_name }}
          releaseBody: Download the installer for your platform below.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterSignatures: false
          args: ${{ matrix.args }}
